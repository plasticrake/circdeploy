[project]
name = "circdeploy"
version = "0.2.1"
description = "Easily deploy your CircuitPython projects"
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Patrick Seal", email = "code@plasticrake.com" }]
keywords = ["circuitpython"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Topic :: Education",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: System :: Software Distribution",
]
dependencies = [
  "circup (>=2.2.2, <3.0.0)",
  "igittigitt (>=2.1.5, <3.0.0)",
  "rich (>=14.0.0, <15.0.0)",
  "typer (>=0.15.3, <0.16.0)",
]

[project.urls]
repository = "https://github.com/plasticrake/circdeploy"
homepage = "https://github.com/plasticrake/circdeploy"

[project.scripts]
circdeploy = "circdeploy:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
tox = "^4.25.0"
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.2.0"
tox-gh-actions = "^3.3.0"
types-toml = "^0.10.8.20240310"

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
